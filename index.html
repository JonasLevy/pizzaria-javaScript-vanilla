<!DOCTYPE html>
<html lang="pt-br">
    <link rel="stylesheet" href="./css/style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marinara Pizza</title>
</head>
<body>
    <header>
        <div class="containerImagInfo">
            <div class="img">
                <img src="./imagens/930437e4-11b0-42a8-9474-31ec620146ca.jpg" alt="">
            </div>
            <div class="info">
                <div class="nomeEmpresa">
                    <h1>Marinara Pizza</h1>
                </div>
                <div class="infoFuncionamento">
                    <button>Taxa de entrega</button>
                    <button>Horário de funcionamento</button>
                    <button>Taxa de entrega</button>
                    <button>Contato</button>
                </div>
            </div>
        </div>
    </header>
    <nav class="categorias" id="categorias"></nav>
    <section>
        <div class="produtos" id="produtos"> </div>        
        <aside class="sacola" id="sacola">
            <div class="listProd" id="listProd">
            <div class="item">
                <p>Item</p>
                <p>Quant</p>
                <p>Preço</p>
                <p>Total</p>
            </div>  
            </div>
            <div class="total">
                <p >Valor dos produtos: <span id="vTotalProds">0,00</span></p>
                <p id="txEntrega">Taxa de entrega:<span> 0,00</span></p>
                <div class="checkout">
                    <h3>Total: <span id="total">0,00</span></h3>
                    <button>Confirmar o pedido</button>

                </div>

            </div>
        </aside>
    </section>
    <footer>
        footer
    </footer>
    <div id="modal" class="modal">
        <div class="cep">
            <span>
                <input type="number" placeholder="digite seu cep">
                <button>pesquisar   </button>
            </span>
            <input type="text" placeholder="rua">
            <button onclick="closeModal()">fechar</button>
        </div>
    </div>
</body>
<script type="module" src="script.js" defer></script>
</html>
