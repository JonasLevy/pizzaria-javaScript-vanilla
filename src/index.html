<!DOCTYPE html>
<html lang="pt-br">
<link rel="stylesheet" href="./css/style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marinara Pizza</title>
    <link rel="icon" href="./assets/imagens/pizzaicon.png">
</head>

<body>
    <header>
        <div class="containerImagInfo">
            <div class="img">
                <img src="./assets/imagens/930437e4-11b0-42a8-9474-31ec620146ca.jpg" alt="">
            </div>
            <div class="info">
                <div class="nomeEmpresa">
                    <h1>Marinara Pizza</h1>
                </div>
                <div class="infoFuncionamento"> 
                    <button id="btnModal">
                        <img src="assets/imagens/delivery.png">
                    </button>
                    <button>
                        <img src="assets/imagens/clock.png">
                    </button>
                    <button>
                        <img src="assets/imagens/phone-chat.png">
                    </button>
                </div>
            </div>
        </div>
    </header>
    <nav class="categorias" id="categorias"></nav>
    <section>
        <div class="produtos" id="produtos"> </div>
        <aside class="sacola" id="sacola">
            <div class="listProd" id="listProd">
                <div class="item">
                    <p>Item</p>
                    <p>Quant</p>
                    <p>Preço</p>
                    <p>Total</p>
                </div>
            </div>
            <div class="totalAmount">
                <p>Valor dos produtos: <span id="cartSubTotal">0,00</span></p>
                <p id="txEntrega">Taxa de entrega:<span> 0,00</span></p>
                <div class="checkout">
                    <h3>Total: <span id="totalAmount">0,00</span></h3>
                    <button>Confirmar o pedido</button>

                </div>

            </div>
        </aside>
    </section>
    <footer>
    <p>Página fictícia criada para fins demonstrativos</p>
    <p>Desenvolvido por <span>Jonas Levy</span></p>
    <div class="footer-links">
        <a href="https://github.com" target="_blank">
            <img src="./assets/imagens/github.png" alt="GitHub">
        </a>
        <a href="https://linkedin.com" target="_blank">
            <img src="./assets/imagens/linkedin.png" alt="LinkedIn">
        </a>
    </div>
    
    </footer>
    <div id="modal" class="modal">
        <div class="cep">
            <span>
                <input type="number" placeholder="digite seu cep">
                <button>pesquisar </button>
            </span>
            <input type="text" placeholder="rua">
            <button id="closeModalBtn">fechar</button>
        </div>
    </div>

    <div class="infoBag" id="infoBag">
        <button id="btnCart" class="btnCart">
            <img class="imgbag" src="assets/imagens/bag.png" alt="">
            <p class="txtInfoBag" id="txtInfoBag">Sacola vazia</p>
        </button>
    </div>
</body>
<script type="module" src="./scripts/script.js" defer></script>

</html>
